<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In</title>
    <link rel="stylesheet" href="./src/css/logIn.css">
</head>
<body>
    <main class="inicio-sesion">
        <div class="inicio-sesion__cont-uno">
            <img src="./images/svg-hackaton/AgroEcoLogo2.svg" alt="Logo">
        </div>
        <div class="inicio-sesion__cont-dos">
            <div>
                <h1>Iniciar sesion</h1>
                <p class="sub-gris">Ingresa tus credenciales</p>
            </div>

            <div class="inicio-sesion__cont-dos__datos">
                <p>Usuario*</p>
                <div class="inicio-sesion__cont-dos__input">
                    <input id="login-correo" type="email" placeholder="Tu@gmail.com">
                    <svg width="36" height="36" fill="currentColor" viewBox="0 0 24 24" transform="" id="injected-svg" xmlns="http://www.w3.org/2000/svg"><!--Boxicons v3.0.8 https://boxicons.com | License  https://docs.boxicons.com/free--><path d="M8.5 10.5c0 2 1.5 3.5 3.5 3.5s3.5-1.5 3.5-3.5S14 7 12 7s-3.5 1.5-3.5 3.5m5 0c0 .88-.62 1.5-1.5 1.5s-1.5-.62-1.5-1.5S11.12 9 12 9s1.5.62 1.5 1.5"></path><path d="m20.53 7.15-8-5c-.32-.2-.74-.2-1.06 0l-8 5c-.29.18-.47.5-.47.85v8c0 .34.18.67.47.85l8 5a1.01 1.01 0 0 0 1.06 0l8-5c.29-.18.47-.5.47-.85V8c0-.34-.18-.67-.47-.85M12 19.82l-3.1-1.94c.55-.56 1.29-.88 2.1-.88h2c.8 0 1.55.32 2.1.88zm7-4.38-2.19 1.37A4.97 4.97 0 0 0 13 15h-2c-1.48 0-2.87.68-3.81 1.81L5 15.44V8.55l7-4.38 7 4.38z"></path></svg>
                </div>

                <div class="inicio-sesion__cont-dos__contra">
                    <p>Contraseña*</p>
                    <a id="btnRecuperarContra">¿La olvidaste?</a>
                </div>

                <div class="inicio-sesion__cont-dos__input">
                    <input id="login-password" type="password" placeholder="••••••••••">
                    <!-- ojo abrierto, lo pongo asi para poder cambiarle el color en el css -->
                    <svg id="eye" width="36" height="36" fill="currentColor" viewBox="0 0 24 24" transform="" id="injected-svg" xmlns="http://www.w3.org/2000/svg"><!--Boxicons v3.0.8 https://boxicons.com | License  https://docs.boxicons.com/free--><path d="M12 9a3 3 0 1 0 0 6 3 3 0 1 0 0-6"></path><path d="M12 19c7.63 0 9.93-6.62 9.95-6.68.07-.21.07-.43 0-.63-.02-.07-2.32-6.68-9.95-6.68s-9.93 6.61-9.95 6.67c-.07.21-.07.43 0 .63.02.07 2.32 6.68 9.95 6.68Zm0-12c5.35 0 7.42 3.85 7.93 5-.5 1.16-2.58 5-7.93 5s-7.42-3.84-7.93-5c.5-1.16 2.58-5 7.93-5"></path></svg>

                    <!-- ojo cerrado -->
                    <svg id="eye-hidden" version="1.1" id="injected-svg" transform="" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" x="0px" y="0px" viewBox="0 0 36 36" style="enable-background:new 0 0 36 36;" xml:space="preserve"><g><path d="M21.2,14.8C21.2,14.8,21.2,14.8,21.2,14.8L21.2,14.8z"/><path d="M15.1,14.6c-0.9,0.8-1.6,2-1.6,3.4c0,2.5,2,4.5,4.5,4.5c1.5,0,2.8-0.7,3.6-1.8L15.1,14.6z"/></g><g><path d="M27.2,25.8l-2.3-2.1c-1.7,1.1-4,1.8-6.9,1.8c-8,0-11.1-5.8-11.9-7.5c0.5-1.2,2.2-4.4,5.9-6.2L9.7,9.7c-4.9,2.9-6.6,7.8-6.6,7.8c-0.1,0.3-0.1,0.6,0,0.9c0,0.1,3.5,10,14.9,10v0C22,28.5,24.9,27.3,27.2,25.8z"/><path d="M32.9,17.5c0-0.1-3.5-10-14.9-10c-1.6,0-3,0.2-4.2,0.5l2.8,2.5c0.5,0,0.9-0.1,1.4-0.1c8,0,11.1,5.8,11.9,7.5c-0.3,0.6-0.9,1.8-1.9,3.1l2.2,2c2-2.3,2.8-4.5,2.8-4.6C33,18.2,33,17.8,32.9,17.5z"/></g><path d="M26.8,29.4L4.4,8.8C3.7,8.2,3.6,7,4.3,6.3L4.6,6c0.7-0.7,1.8-0.8,2.5-0.1l22.5,20.6c0.7,0.7,0.8,1.8,0.1,2.5l-0.3,0.3C28.7,30.1,27.6,30.1,26.8,29.4z"/></svg>
                </div>
            </div>
            <div>
                <div id="alerta">
                    <svg width="30" height="27" viewBox="0 0 30 27" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M28.8431 17.9125L18.7431 1.9625C17.8931 0.7375 16.4806 0 14.9931 0C13.5056 0 12.0931 0.725 11.2056 2L1.1556 17.8875C-0.119398 19.7125 -0.356898 21.9 0.530602 23.5875C1.4056 25.275 3.2431 26.2375 5.5431 26.2375H24.4431C26.7556 26.2375 28.5806 25.275 29.4556 23.5875C30.3306 21.9 30.0931 19.725 28.8431 17.9125ZM13.7431 7.5C13.7431 6.8125 14.3056 6.25 14.9931 6.25C15.6806 6.25 16.2431 6.8125 16.2431 7.5V15C16.2431 15.6875 15.6806 16.25 14.9931 16.25C14.3056 16.25 13.7431 15.6875 13.7431 15V7.5ZM14.9931 22.5C13.9556 22.5 13.1181 21.6625 13.1181 20.625C13.1181 19.5875 13.9556 18.75 14.9931 18.75C16.0306 18.75 16.8681 19.5875 16.8681 20.625C16.8681 21.6625 16.0306 22.5 14.9931 22.5Z" fill="#DC2626"/>
                    </svg>
                    <p id="alerta-mensaje"></p>
                </div>
                <button id="btnLogin" class="boton">    
                    <p class="boton__texto">Entrar</p>
                    <svg class="icono" width="36" height="36" fill="currentColor" viewBox="0 0 24 24" transform="" id="injected-svg" xmlns="http://www.w3.org/2000/svg"><!--Boxicons v3.0.8 https://boxicons.com | License  https://docs.boxicons.com/free--><path d="M6 13h6v4l6-5-6-5v4H6z"></path></svg>
                </button>
            </div>

            <div class="inicio-sesion__cont-dos__registrarse">
                <p class="sub-gris">¿Sin Cuenta?</p>
                <a href="./src/html/crear-cuenta.html">Registrate</a>
            </div>
        </div>
    </main>
    <!--uso id para el nuevo sidebar-->
    <script src="./src/javascript/login.js"></script>
</body>
</html>
