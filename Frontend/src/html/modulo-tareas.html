<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/src/css/tareas.css">
    <title>Tareas</title>
</head>
<body>
    <div class="contenedor">
        <aside>
            <nav class="sidebar">
                <!--Logo AgroEco-->
                <div class="logo">
                    <img src = "/images/svg-hackaton/Logo.svg" class = "logo-svg" alt="Logo AgroEco" width = "70px" height = "auto">    
                    <span id = "agroeco" class = "logo-text">AgroEco</span>            
                </div>
                <ul>
                    <div class="sb_1">
                        <li><a href="/src/html/dasboard.html"><img class = "icon"src = "/images/svg-hackaton/objects-column 1.svg" alt="Dashboard" width = "25px" height = "25px"> <span id = "home">DashBoard</span></a></li>
                        <li><a href="/src/html/modulo-tareas.html"><img class = "icon"src = "/images/svg-hackaton/signal-stream 1.svg" alt="GestorTareas" width = "25px" height = "25px"> <span id = "tareas">Tareas</span></a></li>
                        <li><a href="/src/html/modulo-sensores.html" ><img class = "icon"src = "/images/svg-hackaton/Vector.svg" alt="Sensores" width = "25px" height = "25px"> <span id = "sensores">Sensores</span></a></li>
                        <li><a href="/src/html/modulo-plagas.html"><img class = "icon"src = "/images/svg-hackaton/Group 141.svg" alt="Plagas" width = "25px" height = "25px"> <span id = "plagas">Plagas</span></a></li>
                        <li><a href="/src/html/modulo-educacion.html" ><img class = "icon"src = "/images/svg-hackaton/Vector (1).svg" alt="Imagen" width = "25px" height = "25px"> <span id = "educacion">Educacion</span></a></li>
                        <li><a href="/src/html/inventario.html" ><img class = "icon"src = "/images/svg-hackaton/Vector (2).svg" alt="Bodega" width = "25px" height = "25px"> <span id = "Bodega">Inventario</span></a></li>
                        <li><a href="/src/html/finanzas-modulo.html"><img class = "icon"src = "/images/svg-hackaton/Vector (3).svg" alt="Finanza" width = "25px" height = "25px"> <span id = "finanza">Finanza</span></a></li>
                    </div>
                    <!-- Log Out alfinal-->
                    <div class="sidebar_2">
                        <li><a href="/index.html"><img class="icon logout"src="/images/svg-hackaton/vector (4).svg" alt="Log Out" width = "15px" height = "auto"> <span class = "txtlogout" id = "logout">Log Out</span></a></li>
                    </div>
                </ul>
            </nav>
        </aside>
        <!--Contenido principal-->  
        <main>
            <div class="cont">
                <div class="text">
                    <div class="join">
                        <h1>Gestor De Tareas</h1>
                        <p>Tareas Registradas</p>
                    </div>
                    <button id="makeTarea">Crear Tarea</button>             
                </div>
                <!--EL warining -->
                <div id="warn-cont" class="warn">
                    <div class="cont-warn">
                        <img src="/images/svg-hackaton/Vector (8).svg" width="30px" height="30px" alt="alerta">
                        <p>Tienes <span id="tareasAVencer">0</span> tareas que vencen esta semana</p>                        
                    </div>
                    <p id="irAlerta">→</p>
                </div>
                <!--  Cards-->
                <div class="cards">
                    <div class="card">
                        <!--total-->
                        <span id="total-tareas">0</span>
                        <p>Total</p>

                    </div>
                    <div class="card">
                        <!--criticas-->
                        <span id="pendientes">0</span>
                        <p>Pendientes</p>

                    </div>
                    <div class="card">
                        <!-- En Progreso-->                        
                        <span id="en-progreso">0</span>
                        <p>En Progreso</p>

                    </div>
                    <div class="card">
                       <!--por vencer-->
                       <span id="por-vencer">0</span>
                       <p>Por Vencer</p>

                    </div>
                    <div class="card">
                        <!--vencidas-->
                        <span id="vencidas">0</span>
                        <p>Vencidas</p>

                    </div>
                    <div class="card">
                        <!--completadas-->
                        <span id="completadas">0</span>
                        <p>Completadas</p>
                    </div>
                </div>

                <!-- GRID DE TAREAS LISTA-->
                 <div class="listadeTareas">

                 </div>
            </div>
        </main>
    </div>
    <!-- LOS MODALES-->
    <dialog id="dialog-n-tarea">
        <div class="dialog-cont">            
            <h1>Nueva tarea</h1>
            <label >¿Qué hay que hacer?<br>
                <input type="text" id="name-tarea" placeholder="EJ: Regar cultivo de ..." required>
            </label>
            <label >Descripcion:<br>
                <input type="text" id="desc-tarea" placeholder="Detalles de la tarea ..." required>
            </label>
            <label >Responsable<br>
                <input type="text" id="respo-tarea" placeholder="EJ: Juan Marcos" required>
            </label>            
            <label >Prioridad<br>
                <select id="inputPrioridad">
                    <option value="baja">Baja</option>
                    <option value="media">Media</option>
                    <option value="alta">Alta</option>
                </select>
            </label>
            <label>Fecha límite *
                <input type="date" id="inputFecha" required>
            </label>
            
            <label>Estado Inicial<br>
                <select id="estado-inicial">
                    <option value="progreso">En progreso</option>
                    <option value="pendiente">Pendiente</option>
                    <option value="completada">Completada</option>

                </select>
            </label>

            <div class="join">
                <button>Cancelar</button>
                <button>Guardar tarea</button>
            </div>
        </div>


    </dialog>

    <!--el js -->
    <script src="/src/javascript/sidebar.js"></script>
    <script> updateSidebar()</script>
</body>
</html>
