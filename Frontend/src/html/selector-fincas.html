<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/src/css/selector-finca.css">
    <title>Seleccionar Finca</title>
</head>
<body>
    <div class="container">
        <div class="cont">
            <div class="text">
                <h1>Bienvenido de nuevo,<span id = "user"> {usuario}</span></h1>
                <div class="uniontext">
                    <p>Continua donde lo dejaste en</p>
                    <img src="/images/svg-hackaton/logo/SVG/Logo3.svg" alt="LogoAgroEco" width="100px"height="100px">
                </div>              
            </div>
            <div class="selector">
                <div class="union">
                    <h2>Tus Fincas</h2>
                    <button class="btnAdd" type="submit">Agregar Finca</button>
                    </button>
                </div>
                <div class="boxes">
                    <div class="box">
                        <span class="icon">FD</span>
                        <div class="union-vertical">
                            
                            <p id="finca1">Finca el diamante</p>
                            <!--Editable sera por medio de datos agarrados de c#-->
                            <div class="unionDescription">
                                <span id ="frutaFinca1">Aguacate</span>
                                <span id ="locationFinca1">Carazo,Jinotepe</span>
                            </div>                          
                        </div>
                         <img class="deleteFinca" src="/images/svg-hackaton/trash 1.svg" alt="borrar-icon">
                            <a id="goFinca1" href = "dasboard.html">
                                <span id= "dash1" class="aDash">Ir al DashBoard</span>
                                <img src="/images/svg-hackaton/Arrow 2.svg" alt="">
                            </a>
                    </div>

                    <div class="box">
                        <span class="icon">FD</span>
                        <div class="union-vertical">
                            
                            <p id="finca1">Finca el diamante</p>
                            <!--Editable sera por medio de datos agarrados de c#-->
                            <div class="unionDescription">
                                <span id ="frutaFinca1">Aguacate</span>
                                <span id ="locationFinca1">Carazo,Jinotepe</span>
                            </div>                           

                        </div>
                        <img class="deleteFinca" src="/images/svg-hackaton/trash 1.svg" alt="borrar-icon">
                        <a id="goFinca2" href="dasboard.html">
                            <span id="dash2" class ="aDash">Ir al DashBoard </span>
                            <img src="/images/svg-hackaton/Arrow 2.svg" alt="">
                        </a>
                    </div>
                    
                </div>

            </div>

        </div>
    </div>
    <!-- Modal para Registrar Nueva Finca -->
    <div id="modalFinca" class="modal">
        <div class="modal-content">
            <!-- Botón para cerrar la ventana -->
            <span class="close-btn">&times;</span>
            
            <h2>Registrar Nueva Finca</h2>
            
            <form id="formNuevaFinca">
                <div class="form-group">
                    <label>Nombre de la Finca *</label>
                    <input type="text" id="inputNombre" placeholder="Mi Finca" required>
                </div>
                
                <div class="form-group">
                    <label>Ubicacion *</label>
                    <input type="text" id="inputUbicacion" placeholder="Departamento, municipio" required>
                </div>
                
                <div class="form-row">
                    <div class="form-group half">
                        <label>Area (Manzanas)</label>
                        <input type="number" id="inputArea" placeholder="2">
                    </div>
                    <div class="form-group half">
                        <label>Cultivo *</label>
                        <input type="text" id="inputCultivo" placeholder="Aguacate" required>
                    </div>
                </div>
                
                <div class="form-group">
                    <label>Descripción</label>
                    <textarea id="inputDescripcion" placeholder="Descripcion..........." rows="4"></textarea>
                </div>
                
                <!-- Agregué un botón de guardar para poder enviar el formulario -->
                <button type="submit" class="btnGuardar">Guardar Finca</button>
            </form>
        </div>
    </div>
    <!-- el js-->
    <script>const PAGE_ID = "selector-fincas";</script> 
    <script src="/src/javascript/selector-finca.js"></script>
</body>
</html>
